<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>آزمون</title>
<style>body{font-family:sans-serif;margin:0;background:#f0f0f1}header{background:#1d2327;color:#fff;padding:18px 32px;font-size:22px}
main{display:grid;grid-template-columns:1fr 360px;gap:32px;padding:48px}.card{background:#fff;border-radius:8px;padding:32px}
input[type=text]{width:100%;font-size:40px;border:0;outline:0;font-family:inherit}textarea{width:100%;height:240px;font-size:22px;border:0;outline:0;font-family:inherit}
button{font:inherit;font-size:20px;padding:12px 28px;border-radius:6px;border:0;background:#2271b1;color:#fff}label{font-size:20px}</style></head>
<body><header>پیشخوان آزمایشی</header><main><div class="card"><input id="t" type="text" placeholder="افزودن عنوان"><hr><textarea id="b" placeholder="متن را بنویسید"></textarea></div>
<div class="card"><button id="pub">انتشار</button><h3>دسته‌ها</h3><label><input id="c" type="checkbox"> اخبار</label></div></main></body></html>
